<style>
  :root{
    --bg:#07070f;--text:#eaeaf5;--muted:#9a9ab5;
    --grad:linear-gradient(135deg,#7c5cff,#00e0ff,#ff4ecd);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:20px;line-height:1.7;
  }
  h1{
    font-size:clamp(5rem,16vw,9rem);font-weight:900;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h2{font-size:clamp(1.2rem,3vw,1.8rem);margin:14px 0 10px}
  p{color:var(--muted);max-width:460px;margin:0 auto 30px}
  a.btn{
    display:inline-block;padding:14px 34px;border-radius:14px;text-decoration:none;
    background:var(--grad);color:#fff;font-weight:800;
    box-shadow:0 8px 30px rgba(124,92,255,.45);transition:transform .25s;
  }
  a.btn:hover{transform:translateY(-4px) scale(1.03)}
</style>
</head>

<main>
